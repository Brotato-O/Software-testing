# DataSource settings - MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
#spring.datasource.username=hbstudent
#spring.datasource.password=hbstudent
spring.datasource.username=root
spring.datasource.password=

# JPA/Hibernate settings
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# # Server settings
# server.port=8080

# Server settings - HTTPS
server.port=8080
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=123456
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=springboot

# Logging
logging.level.com.flogin=INFO
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG