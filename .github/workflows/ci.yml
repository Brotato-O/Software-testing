name: CI - Product Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  product-tests:
    name: Build & Product E2E
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpwd
          MYSQL_DATABASE: test
          MYSQL_USER: testuser
          MYSQL_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd='mysqladmin ping --silent'
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      # Override Spring datasource to use the MySQL service
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/test?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: testuser
      SPRING_DATASOURCE_PASSWORD: testpass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java (for backend build)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven local repository
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

      - name: Build backend (Maven)
        working-directory: backend
        run: mvn -B -DskipTests package

      - name: Start backend
        working-directory: backend
        run: |
          # Start the Spring Boot app in background and redirect logs
          nohup mvn spring-boot:run > ../backend.log 2>&1 &
          echo $! > ../backend.pid
          # Wait for backend to accept connections
          for i in $(seq 1 30); do
            if curl -sS http://localhost:8080/ > /dev/null; then
              echo "Backend is up"
              break
            fi
            echo "Waiting for backend... ($i)"
            sleep 2
          done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Cypress product spec
        working-directory: frontend
        run: npx cypress run --spec "cypress/e2e/products.cy.js" --headless
        env:
          CI: true

      - name: Upload Cypress videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-videos
          path: frontend/cypress/videos

      - name: Upload Cypress screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots
          path: frontend/cypress/screenshots

      - name: Upload backend logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log
          path: backend.log

      - name: Stop backend
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill $(cat backend.pid) || true
          fi
